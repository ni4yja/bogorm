name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    # Python, GDAL, gettext and project dependencies are baked into this image
    # (backend/Dockerfile.ci, built by ci-image.yml).
    container:
      image: ghcr.io/${{ github.repository_owner }}/bogorm-ci-base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bogorm
          POSTGRES_PASSWORD: bogorm
          POSTGRES_DB: bogorm
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Inside a container job, services are reached by their name, not localhost.
    env:
      SECRET_KEY: test-secret-key
      DATABASE_URL: postgis://bogorm:bogorm@postgres:5432/bogorm
      DATABASE_HOST: postgres  # config/settings/test.py otherwise forces localhost
      DJANGO_SETTINGS_MODULE: config.settings.test

    steps:
      - uses: actions/checkout@v4

      # Fast no-op unless this PR changes requirements.
      - name: Install dependencies
        run: pip install -r backend/requirements/local.txt

      - name: Compile translations
        working-directory: backend
        run: python manage.py compilemessages

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v